# Base44 sandbox/dev environment for Cocoa Ledger.
#
# Mirrors how the app runs in production (React CRA dev server + FastAPI + MongoDB)
# but serves everything from the cloned source, with live reload:
#   - web  (port 3000, the preview entry point) proxies /api to the api service, so the
#     app is single-origin and the httpOnly auth cookies work inside the preview iframe.
#   - api  (port 8001, internal only) runs `uvicorn --reload` against the bind-mounted source.
#   - mongo persists to a named volume.
#
# Bring up:  docker compose -f docker-compose.base44.yml up -d --build
services:
  mongo:
    image: mongo:7
    restart: on-failure
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.base44
    restart: on-failure
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=cocoa_ledger
      - CORS_ORIGINS=*
      # watchfiles needs polling because the source lives on a bind mount
      - WATCHFILES_FORCE_POLLING=true
      - BASE44_PREVIEW_MODE
    env_file:
      # sandbox defaults first, so real secrets from the dashboard always win.
      # JWT_SECRET (required at boot) is supplied by /run/base44/app.env.
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/openapi.json >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: node:20
    restart: on-failure
    working_dir: /app
    volumes:
      - ./frontend:/app
      # keep node_modules inside a volume: the bind mount above would hide a
      # directory installed into the image
      - frontend_node_modules:/app/node_modules
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      # empty on purpose: axios then calls the relative /api path that this dev
      # server proxies to the api service (single origin => cookies work)
      - REACT_APP_BACKEND_URL=
      - API_PROXY_TARGET=http://api:8001
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - CI=true
      # react-scripts start is slow on a cold node_modules volume
      - WDS_SOCKET_PORT=443
    command:
      - sh
      - -ec
      - |
        corepack enable >/dev/null 2>&1 || true
        yarn install --frozen-lockfile --network-timeout 600000
        exec yarn start
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  mongo_data:
  frontend_node_modules:
